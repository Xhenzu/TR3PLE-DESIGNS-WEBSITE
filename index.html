
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>TR3PLE DESIGNS</title>
      <meta name="description" content="Showcasing TR3PL Designs Limited&#39;s creative solutions, this website features an interactive portfolio and engaging storytelling experiences, enhancing user engagement." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        (function () {
          try {
            var saved = localStorage.getItem("tr3pl-theme");
            var theme = saved || "dark";
            document.documentElement.classList.toggle("dark", theme === "dark");
          } catch (e) {
            document.documentElement.classList.add("dark");
          }
        })();
      </script>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
